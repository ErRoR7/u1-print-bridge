# U1 Print Bridge — Docker Compose
#
# IMPORTANT: DATA_DIR=/data must be set in .env. Both services persist job
# state and slice artifacts on the printbridge-data volume mounted at /data,
# so DATA_DIR has to point at that same mount.

services:
  api:
    build: ./backend
    image: u1-print-bridge-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Compose DNS resolves the converter service by name.
      - CONVERTER_URL=http://converter:8080
    volumes:
      - printbridge-data:/data
      # The API serves the static frontend from /app/frontend (FRONTEND_DIR).
      - ./frontend:/app/frontend:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  slicer:
    build: ./slicer
    image: u1-print-bridge-slicer
    env_file:
      - .env
    volumes:
      - printbridge-data:/data
    restart: unless-stopped

  # Bambu/MakerWorld 3MF -> U1 converter (optional). The api calls it over
  # HTTP when CONVERTER_URL is set; with no converter the bridge just uses
  # the original file. Prebuilt upstream image, no build step.
  converter:
    image: ghcr.io/thadius83/bambu-to-snapmaker-u1:latest
    ports:
      - "8084:8080"
    restart: unless-stopped

volumes:
  printbridge-data:
